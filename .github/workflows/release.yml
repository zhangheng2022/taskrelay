name: Production release
on:
  workflow_dispatch:
    inputs:
      scope:
        description: 发布范围（遗漏必要范围会失败）
        type: choice
        options:
          - auto
          - all
          - cloud
          - desktop
        default: auto
      mode:
        description: 发布或恢复未完成发布
        type: choice
        options:
          - publish
          - resume
        default: publish
      source-sha:
        description: 固定提交 SHA；留空使用本次 master
        required: false
        type: string
      recovery-run:
        description: 恢复时填写首次验收运行 ID
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      cloud: ${{ steps.plan.outputs.cloud }}
      desktop: ${{ steps.plan.outputs.desktop }}
      version: ${{ steps.plan.outputs.version }}
      mode: ${{ steps.plan.outputs.mode }}
      artifactRunId: ${{ steps.plan.outputs.artifactRunId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - &a1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
          cache: npm
      - &a2
        run: npm ci --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.source-sha || github.sha }}
          RELEASE_SCOPE: ${{ inputs.scope }}
          RELEASE_MODE: ${{ inputs.mode }}
          RECOVERY_RUN: ${{ inputs.recovery-run }}
        run: node scripts/release-preflight.mjs
  web:
    needs: preflight
    if: needs.preflight.outputs.cloud == 'true' && needs.preflight.outputs.mode ==
      'publish'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}
      - *a1
      - *a2
      - run: npm audit --audit-level=high
      - run: node scripts/audit-runtime.mjs
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: production-web
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
  desktop:
    needs: preflight
    if: needs.preflight.outputs.desktop == 'true' && needs.preflight.outputs.mode ==
      'publish'
    uses: ./.github/workflows/windows-package.yml
    with:
      source-sha: ${{ needs.preflight.outputs.sha }}
  production:
    needs:
      - preflight
      - web
      - desktop
    if: always() && needs.preflight.result == 'success' && (needs.web.result ==
      'success' || needs.web.result == 'skipped') && (needs.desktop.result ==
      'success' || needs.desktop.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: b3a410496c5e49e582b4af19d2f2eec6
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      RELEASE_CLOUD: ${{ needs.preflight.outputs.cloud }}
      RELEASE_DESKTOP: ${{ needs.preflight.outputs.desktop }}
      RELEASE_MODE: ${{ needs.preflight.outputs.mode }}
      ARTIFACT_RUN_ID: ${{ needs.preflight.outputs.artifactRunId }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.preflight.outputs.sha }}
      - *a1
      - *a2
      - if: needs.preflight.outputs.cloud == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: production-web
          path: apps/web/dist
          run-id: ${{ needs.preflight.outputs.artifactRunId }}
          github-token: ${{ github.token }}
      - if: needs.preflight.outputs.desktop == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: windows-release
          path: artifacts/windows
          run-id: ${{ needs.preflight.outputs.artifactRunId }}
          github-token: ${{ github.token }}
      - run: npm audit --audit-level=high
      - run: node scripts/audit-runtime.mjs
      - run: node --import tsx scripts/release-production.mjs
