name: Build · Windows 构建验收
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      archive-package:
        description: 保存完整产物；PR 仅保存报告
        type: boolean
        default: false
      artifact-name:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.package.outputs.verified }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  package:
    name: Windows · 打包与安装验收
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}
      - uses: ./.github/actions/setup-node
        with:
          electron: "true"
      - run: npm run prepare:browser
      - run: node --import tsx --test tests/browser-state-desktop.test.ts
      - run: npm run make
      - run: npm run test:smoke
      - run: ./scripts/install-smoke.ps1
        shell: pwsh
      - run: node scripts/release-manifest.mjs
      - run: node scripts/prepare-update.mjs docs/RELEASE-NOTES.md
      - if: inputs.archive-package
        run: node scripts/release-artifacts.mjs stage-windows
      - if: inputs.archive-package
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: out/candidate-windows
          if-no-files-found: error
          retention-days: 30
      - if: ${{ !inputs.archive-package }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-acceptance-${{ github.run_attempt }}
          path: |
            out/release-manifest.json
            out/desktop-release.json
            out/system-entry.json
            out/*-smoke.json
          if-no-files-found: error
          retention-days: 7
      - id: verified
        name: Verify · 记录完成
        shell: bash
        run: echo 'verified=true' >> "$GITHUB_OUTPUT"
