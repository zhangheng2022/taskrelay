name: Build · Windows 构建验收
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
      archive-package:
        description: 保存完整产物；PR 仅保存报告
        type: boolean
        default: false
      artifact-name:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.package.outputs.verified }}
      artifact-id:
        value: ${{ jobs.package.outputs.artifact-id }}
permissions:
  contents: read
jobs:
  package:
    name: Windows · 打包与安装验收
    runs-on: windows-2025
    timeout-minutes: 35
    # PR 只进入不含 secrets 的测试环境；正式签名环境另以 master 分支规则限制访问。
    environment: ${{ inputs.archive-package && 'windows-signing' || 'windows-signing-test' }}
    env:
      TASKRELAY_RELEASE_SIGNING: ${{ inputs.archive-package && 'true' || 'false' }}
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
      artifact-id: ${{ steps.archive.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
      - if: inputs.archive-package
        name: Signing · 验证可信来源
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/master' -or $env:GITHUB_EVENT_NAME -notin @('push', 'workflow_dispatch')) { throw 'SIGNING_TRUSTED_MASTER_REQUIRED' }
          git merge-base --is-ancestor HEAD origin/master
          if ($LASTEXITCODE -ne 0) { throw 'SIGNING_SOURCE_NOT_ON_MASTER' }
      - uses: ./.github/actions/setup-node
        with:
          electron: "true"
      - run: npm run prepare:browser
      - run: node --import tsx --test tests/browser-state-desktop.test.ts
      - if: inputs.archive-package
        name: Signing · 准备发布证书
        shell: pwsh
        run: ./scripts/signing-certificate.ps1 -Action Prepare -TrustBuildMachine
        env:
          TASKRELAY_SIGNING_PFX_BASE64: ${{ secrets.TASKRELAY_SIGNING_PFX_BASE64 }}
          TASKRELAY_SIGNING_PASSWORD: ${{ secrets.TASKRELAY_SIGNING_PASSWORD }}
      - if: ${{ !inputs.archive-package }}
        name: Signing · 准备临时测试证书
        shell: pwsh
        run: ./scripts/signing-certificate.ps1 -Action Prepare -TestCertificate -TrustBuildMachine
      - run: npm run make
        env:
          GH_TOKEN: ${{ github.token }}
      - if: always()
        name: Signing · 结束私钥使用
        shell: pwsh
        run: ./scripts/signing-certificate.ps1 -Action Seal
      - name: Signing · 核验安装包
        shell: pwsh
        run: ./scripts/windows-signature.ps1 -Action Report -Output out/packaged-signatures.json
      - run: npm run test:smoke
      - run: ./scripts/install-smoke.ps1
        shell: pwsh
      - name: Signing · 核验实际安装
        shell: pwsh
        run: ./scripts/windows-signature.ps1 -Action Report -Installed
      - if: always()
        name: Signing · 清理临时密钥
        shell: pwsh
        run: ./scripts/signing-certificate.ps1 -Action Cleanup
      - run: node scripts/release-manifest.mjs
      - run: node scripts/prepare-update.mjs docs/RELEASE-NOTES.md
      - if: inputs.archive-package
        run: node scripts/release-artifacts.mjs stage-windows
      - if: inputs.archive-package
        id: archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: out/candidate-windows
          if-no-files-found: error
          retention-days: 30
      - if: ${{ !inputs.archive-package }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-acceptance-${{ github.run_attempt }}
          path: |
            out/release-manifest.json
            out/desktop-release.json
            out/system-entry.json
            out/*-smoke.json
            out/*signatures.json
          if-no-files-found: error
          retention-days: 7
      - id: verified
        name: Verify · 记录完成
        shell: bash
        run: echo 'verified=true' >> "$GITHUB_OUTPUT"
