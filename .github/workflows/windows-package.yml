name: Windows package acceptance
on:
  workflow_call:
    inputs:
      source-sha:
        required: true
        type: string
    outputs:
      verified:
        value: ${{ jobs.package.outputs.verified }}
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    outputs:
      verified: ${{ steps.verified.outputs.verified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source-sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run prepare:browser
      - run: npm run make
      - run: npm run test:smoke
      - run: ./scripts/install-smoke.ps1
        shell: pwsh
      - run: node scripts/release-manifest.mjs
      - run: node scripts/prepare-update.mjs docs/RELEASE-NOTES.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-release
          path: |-
            apps/desktop/out/make/squirrel.windows/x64/*
            out/release-manifest.json
            out/desktop-release.json
            out/system-entry.json
            out/*-smoke.json
          if-no-files-found: error
          retention-days: 7
      - id: verified
        shell: bash
        run: echo 'verified=true' >> "$GITHUB_OUTPUT"
